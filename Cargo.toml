[package]
name = "mls-assist"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1.0.147", features = ["derive"] }
openmls_traits = { version = "0.4.1-rc.1", git = "https://github.com/openmls/openmls.git", branch = "raphael/v0.7.1-follow-up" }
openmls = { version = "0.7.1-rc.1", git = "https://github.com/openmls/openmls.git", branch = "raphael/v0.7.1-follow-up" }
openmls_rust_crypto = { version = "0.4.1-rc.1", git = "https://github.com/openmls/openmls.git", branch = "raphael/v0.7.1-follow-up" }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
serde_bytes = "0.11.17"
